<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d4fdf7">
  <meta name="description" content="SixTeal — discover curated lifestyle essentials for a more mindful tomorrow.">
  <title>SixTeal — A More Mindful Tomorrow</title>
  <style>
    :root {
      color-scheme: light;
      --background: #e3fbf8;
      --foreground: #0b2421;
      --primary: #089e8c;
      --primary-deep: #116c62;
      --primary-foreground: #fbfefe;
      --muted: #52716c;
      --border: rgb(8 158 140 / 18%);
      --radius: 999px
    }

    * {
      box-sizing: border-box
    }

    html {
      min-height: 100%
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 28px;
      color: var(--foreground);
      background: radial-gradient(ellipse at 15% 15%, rgb(184 243 235 / 85%), transparent 42%), radial-gradient(ellipse at 90% 85%, rgb(8 158 140 / 13%), transparent 38%), var(--background);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased
    }

    .page {
      position: relative;
      isolation: isolate;
      width: min(100%, 760px);
      padding: clamp(32px, 7vw, 72px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 32px;
      background: rgb(251 254 254 / 76%);
      box-shadow: 0 24px 80px rgb(11 36 33 / 8%);
      text-align: center;
      backdrop-filter: blur(16px);
      animation: arrive 700ms cubic-bezier(.2, .75, .25, 1) both
    }

    .page:before,
    .page:after {
      position: absolute;
      z-index: -1;
      width: 220px;
      aspect-ratio: 1;
      content: "";
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none
    }

    .page:before {
      top: -145px;
      left: -95px;
      background: rgb(184 243 235 / 75%)
    }

    .page:after {
      right: -130px;
      bottom: -160px;
      background: rgb(8 158 140 / 12%)
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 42px;
      color: var(--primary-deep);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -.055em;
      text-decoration: none
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 12px;
      color: var(--primary-foreground);
      background: linear-gradient(135deg, #32a395, #089e8c 58%, #116c62);
      box-shadow: 0 6px 18px rgb(8 158 140 / 22%)
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: var(--primary-deep);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase
    }

    .eyebrow:before {
      width: 7px;
      height: 7px;
      content: "";
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 5px rgb(8 158 140 / 10%)
    }

    h1 {
      max-width: 600px;
      margin: 0 auto;
      font-size: clamp(2.6rem, 7vw, 5rem);
      font-weight: 800;
      letter-spacing: -.075em;
      line-height: .98
    }

    h1 span {
      display: block;
      margin-top: 8px;
      color: var(--primary-deep)
    }

    .description {
      max-width: 470px;
      margin: 24px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.75
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 32px
    }

    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 22px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--primary-foreground);
      background: linear-gradient(110deg, #32a395, #089e8c 55%, #116c62);
      box-shadow: 0 9px 22px rgb(8 158 140 / 22%);
      font: inherit;
      font-size: .95rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 13px 28px rgb(8 158 140 / 28%)
    }

    .button:focus-visible {
      outline: 3px solid rgb(8 158 140 / 35%);
      outline-offset: 4px
    }

    .button.secondary {
      border-color: var(--border);
      color: var(--primary-deep);
      background: rgb(184 243 235 / 45%);
      box-shadow: none
    }

    .button.secondary:hover {
      background: rgb(184 243 235 / 85%)
    }

    .footer {
      margin: 36px 0 0;
      color: #65857f;
      font-size: .8rem
    }

    .arrow {
      display: inline-block;
      transition: transform 180ms ease
    }

    .button:hover .arrow {
      transform: translateX(3px)
    }

    @keyframes arrive {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.99)
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1)
      }
    }

    @media(max-width:480px) {
      body {
        padding: 16px
      }

      .page {
        border-radius: 24px
      }

      .brand {
        margin-bottom: 34px
      }

      .actions {
        flex-direction: column
      }

      .button {
        width: 100%
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <a class="brand" href="https://sixteal.vercel.app/" aria-label="SixTeal home">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" fill="none">
          <path d="M12 2.8 14.5 9.5 21.2 12 14.5 14.5 12 21.2 9.5 14.5 2.8 12 9.5 9.5 12 2.8Z" stroke="currentColor"
            stroke-width="1.6" stroke-linejoin="round" />
          <circle cx="18.5" cy="5.5" r="1.4" fill="currentColor" />
        </svg></span>SixTeal
    </a>
    <p class="eyebrow">A more mindful tomorrow</p>
    <h1>Live better.<span>Every day.</span></h1>
    <p class="description">Discover thoughtfully curated essentials for your style, your space, and your well-being.
      Good products. Better everyday moments.</p>
    <div class="actions">
      <a class="button" href="https://sixteal.vercel.app/">Visit SixTeal <span class="arrow"
          aria-hidden="true">→</span></a>
      <a class="button secondary" href="https://sixteal.vercel.app/products">Explore collections</a>
    </div>
    <p class="footer">Fashion · Tech · Literature · Fragrance · Accessories · Wellness</p>
  </main>
</body>

</html>
